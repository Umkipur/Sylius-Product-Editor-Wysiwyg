# Delete these routes and define your own shop routes here

umkipur_sylius_example_static_welcome:
    path: /static-welcome/{name}
    defaults:
        _controller: Umkipur\SyliusProductEditorWysiwyg\Controller\GreetingController::staticallyGreetAction
        name: ~

umkipur_sylius_example_dynamic_welcome:
    path: /dynamic-welcome/{name}
    defaults:
        _controller: Umkipur\SyliusProductEditorWysiwyg\Controller\GreetingController::dynamicallyGreetAction
        name: ~
